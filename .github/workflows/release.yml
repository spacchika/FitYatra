name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      # Evaluate the secret check once here so it is safe to use in step `if` conditions.
      # Direct comparison of secrets in step `if` is not allowed by GitHub Actions.
      SIGNING_ENABLED: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # The committed local.properties has a Windows SDK path.
      # GitHub Actions ubuntu-latest ships the Android SDK at $ANDROID_SDK_ROOT.
      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Debug build (always) ──────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitYatra-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Signed release build (only when keystore secrets are set) ─────────
      - name: Decode keystore
        if: env.SIGNING_ENABLED == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Build signed release APK
        if: env.SIGNING_ENABLED == 'true'
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload signed release APK
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitYatra-release-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ── Unsigned release build (when no keystore) ─────────────────────────
      - name: Build unsigned release APK
        if: env.SIGNING_ENABLED != 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload unsigned release APK
        if: env.SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FitYatra-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  # ── GitHub Release on version tags ───────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: FitYatra-debug-${{ github.sha }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
